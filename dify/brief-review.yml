                - The Japanese title or problem MUST contain business_name_ja verbatim, and the English title or problem MUST contain business_name_en verbatim. Never replace the name with a description such as "a ramen shop in Sapporo" or "a guesthouse near Otaru Canal", never translate its meaning, and never invent a different name. Other shop, product and place names follow the same rule.

