      - id: '1732500000006'
        type: custom
        data:
          type: code
          code_language: python3
          code: |
            import json, re

            def parse(text):
                if not text:
                    return {}
                m = re.search(r"```(?:json)?\s*([\s\S]*?)```", text)
                body = m.group(1) if m else text
                s, e = body.find("{"), body.rfind("}")
                if s == -1 or e <= s:
                    return {}
                try:
                    return json.loads(body[s:e + 1])
                except Exception:
                    return {}

            SEP = r"[\s\u3000\-\u2010-\u2015\u30fc\uff0d().]*"
            HONORIFIC_EN = r"(?:(?<![A-Za-z])(?:Mr|Mrs|Ms|Miss|Mx|Dr)\.?\s+)?"
            SUFFIX_EN = r"(?:[\s\-]?(?:san|sama|chan|kun|sensei|shi))?"
            SUFFIX_JA = r"(?:さん|様|さま|ちゃん|くん|君|氏|殿)?"
            CONTACT_RE = re.compile(r"[\w.+\-]+@[\w\-]+(?:\.[\w\-]+)+|(?<!\d)\+?\d[\d\s\-\u2010-\u2015\u30fc\uff0d().]{7,}\d(?!\d)")


            def is_contact(v):
                if "@" in v:
                    return True
                digits = re.sub(r"\D", "", v)
                return len(digits) >= 7 and re.fullmatch(r"[\d\s+\-\u2010-\u2015\u30fc\uff0d().]+", v) is not None


            def value_pattern(v):
                if is_contact(v) and "@" not in v:
                    digits = re.sub(r"\D", "", v)
                    return re.compile(r"(?<!\d)" + SEP.join(digits) + r"(?!\d)")
                parts = [re.escape(t) for t in v.split()]
                if all(ord(c) < 128 for c in v):
                    body = r"[\s\-.,']*".join(parts)
                    return re.compile(HONORIFIC_EN + r"(?<![A-Za-z0-9])" + body + r"(?![A-Za-z0-9])" + SUFFIX_EN, re.I)
                return re.compile(r"[\s\u3000]*".join(parts) + SUFFIX_JA)


            def romaji_patterns(r):
                tokens = re.findall(r"[A-Za-z]+", r)
                if not tokens:
                    return []
                pats = [(len(r), re.compile(HONORIFIC_EN + r"(?<![A-Za-z])" + r"[\s\-.,']*".join(re.escape(t) for t in tokens) + r"(?![A-Za-z])" + SUFFIX_EN, re.I))]
                if len(tokens) > 1:
                    # Single name parts ("Ms. Tanaka") would still identify the person.
                    for t in tokens:
                        if len(t) >= 4:
                            pats.append((len(t), re.compile(HONORIFIC_EN + r"(?<![A-Za-z])" + re.escape(t) + r"(?![A-Za-z])" + SUFFIX_EN, re.I)))
                return pats


            def build_scrubbers(p, values, verified):
                """Returns [(compiled pattern, is_contact)] longest-first for verified values and their romaji."""
                out = []
                ver_values = [values[i] for i in verified]
                for v in ver_values:
                    out.append((len(v), value_pattern(v), is_contact(v)))
                names = [v for v in ver_values if not is_contact(v)]
                has_ja_name = any(any(ord(c) >= 128 for c in v) for v in names)
                for entry in (p.get("pii_romaji", []) or []):
                    forms = []
                    if isinstance(entry, dict):
                        if str(entry.get("value", "")).strip() in names:
                            rr = entry.get("romaji", [])
                            forms = [rr] if isinstance(rr, str) else list(rr or [])
                    elif isinstance(entry, str) and has_ja_name:
                        forms = [entry]
                    for r in forms:
                        r = str(r).strip()
                        if len(r) >= 2:
                            for size, pat in romaji_patterns(r):
                                out.append((size, pat, False))
                out.sort(key=lambda x: -x[0])
                return [(pat, c) for _, pat, c in out]


            def scrub(text, scrubbers, lang):
                if not isinstance(text, str):
                    return text
                for pat, contact in scrubbers:
                    if lang == "ja":
                        rep = "[連絡先]" if contact else "お客様"
                    else:
                        rep = "[contact]" if contact else "a customer"
                    text = pat.sub(rep, text)
                return text


            def clean_item(item, scrubbers):
                for pat, _ in scrubbers:
                    item = pat.sub("", item)
                item = CONTACT_RE.sub("", item)
                item = re.sub(r"[\(（\[［]\s*[\)）\]］]", "", item)
                item = re.sub(r"\s+", " ", item).strip(" :：,、;-–—")
                return item or "personal data"

            GENERIC_EN = re.compile(
                r"\b(?:a|an|the|this|our|my|one)\s+"
                r"(?:(?:small|local|family[- ]run|family[- ]owned|popular|busy|traditional|independent|little|tiny|cozy|old|new)\s+)*"
                r"(?:[A-Za-z][A-Za-z-]*\s+){0,2}?"
                r"(?:ramen shop|noodle shop|shop|store|restaurant|guest ?house|inn|ryokan|hotel|hostel|farm|bakery|cafe|caf\u00e9|salon|clinic|brewery|business|company|izakaya|diner|eatery|bar|firm|contractor)"
                r"(?![A-Za-z])(?!['\u2019]s\s+(?:owner|manager)|\s+(?:owner|owners|manager|managers|staff|operator)\b)",
                re.I,
            )


            def business_names(meta, brief, n):
                """(ja, en) business name: Meta first, else the draft title prefix ("<name>: ..."); en from the editor."""
                m = parse(meta) if meta else {}
                ja = str(m.get("business", "") or "").strip() if isinstance(m, dict) else ""
                if not ja:
                    b = parse(brief)
                    t = str(((b.get("ja") or {}) if isinstance(b, dict) else {}).get("title", "") or "")
                    if re.search(r"[:\uff1a]", t):
                        ja = re.split(r"[:\uff1a]", t, 1)[0].strip()
                if len(ja) > 40 or ja.startswith("("):
                    ja = ""
                en = re.sub(r"\s+", " ", str(n.get("business_name_en", "") or "")).strip()
                if en and (len(en) > 60 or not any(c.isalpha() and ord(c) < 128 for c in en)):
                    en = ""
                if not en and ja and all(ord(c) < 128 for c in ja):
                    en = ja
                return ja, en


            def ensure_business_name(n, ja_name, en_name, ja_used=""):
                """Deterministic guard: the name must appear in en.title/en.problem and ja.title/ja.problem."""
                en = n.get("en")
                if en_name and isinstance(en, dict):
                    head = (str(en.get("title", "")) + " " + str(en.get("problem", ""))).lower()
                    if en_name.lower() not in head and not (ja_name and ja_name in head):
                        prob = str(en.get("problem", ""))
                        new, k = GENERIC_EN.subn(en_name, prob, count=1)
                        en["problem"] = new if k else (en_name + ": " + prob if prob else en_name)
                ja = n.get("ja")
                if ja_name and isinstance(ja, dict):
                    if ja_name not in str(ja.get("title", "")) + str(ja.get("problem", "")):
                        # The editor wrote a variant (e.g. katakana モリノファーム for 森野ファーム): restore the original everywhere.
                        if ja_used and ja_used != ja_name and len(ja_used) >= 2:
                            for k in list(ja.keys()):
                                if isinstance(ja[k], str):
                                    ja[k] = ja[k].replace(ja_used, ja_name)
                        if ja_name not in str(ja.get("title", "")) + str(ja.get("problem", "")):
                            prob = str(ja.get("problem", ""))
                            ja["problem"] = ja_name + "\uff1a" + prob if prob else ja_name
                return n

            ALLOWED = {"ai-automation", "spreadsheets", "line-bot", "booking-automation", "email-automation", "inventory", "bookkeeping", "social-media", "translation", "paperwork-automation", "web", "data-analysis"}


            def main(pii: str, feasibility: str, grounding: str, normalized: str, grounding_level: str, brief: str, transcript: str, meta: str = "") -> dict:
                p, f, g, n = parse(pii), parse(feasibility), parse(grounding), parse(normalized)
                level = (grounding_level or "").strip().lower()
                feas = float(f.get("feasibility_score", 50) or 50)
                clar = float(f.get("clarity_score", 50) or 50)
                grnd = float(g.get("grounding_score", 50) or 50)
                score = round(0.45 * feas + 0.25 * clar + 0.30 * grnd)
                issues = list(f.get("issues", []) or []) + list(g.get("issues", []) or [])
                # Deterministic guard: only values that literally appear in the input count as PII.
                haystack = (brief or "") + " " + (transcript or "")
                values = [str(v).strip() for v in (p.get("pii_values", []) or [])]
                items = [str(i) for i in (p.get("pii_items", []) or [])]
                verified = [i for i, v in enumerate(values) if len(v) >= 2 and v in haystack]
                pii_found = len(verified) > 0
                scrubbers = build_scrubbers(p, values, verified) if pii_found else []
                if pii_found:
                    kinds = []
                    for i in verified:
                        k = clean_item(items[i], scrubbers) if i < len(items) else "personal data"
                        if k not in kinds:
                            kinds.append(k)
                    issues.insert(0, "Personal data found in the interview; it was removed from the published brief: " + "; ".join(kinds))
                if level == "ungrounded":
                    score = min(score, 59)
                    issues.insert(0, "Ungrounded: no real-world sources were found, so no stand-in data was generated.")
                elif level == "national":
                    score = min(score, 85)
                if score >= 75 and not pii_found and level != "ungrounded":
                    rec = "approve"
                elif score < 40:
                    rec = "reject"
                else:
                    rec = "revise"
                skills = [s for s in (f.get("skills_needed", []) or []) if s in ALLOWED] or ["ai-automation"]
                if f.get("suggested_scope"):
                    issues.append("Suggested MVP: " + str(f["suggested_scope"]))
                out = {
                    "recommendation": rec,
                    "score": max(0, min(100, score)),
                    "issues": [scrub(str(i), scrubbers, "en") for i in issues if i][:8],
                    "pii_found": pii_found,
                    "grounding_comment": scrub(str(g.get("grounding_comment", "")), scrubbers, "en"),
                    "skills_needed": skills,
                }
                keys = ("title", "problem", "current_process", "desired_outcome")
                if all(isinstance(n.get(l), dict) and all(isinstance(n[l].get(k), str) for k in keys) for l in ("ja", "en")):
                    ja_name, en_name = business_names(meta, brief, n)
                    ensure_business_name(n, ja_name, en_name, str(n.get("business_name_ja", "") or "").strip())
                    out["normalized"] = {l: {k: scrub(n[l][k], scrubbers, l) for k in keys} for l in ("ja", "en")}
                return {"result": json.dumps(out, ensure_ascii=False)}
          variables:
            - variable: pii
              value_selector:
                - '1732500000002'
                - text
            - variable: feasibility
              value_selector:
                - '1732500000003'
                - text
            - variable: grounding
              value_selector:
                - '1732500000004'
                - text
            - variable: normalized
              value_selector:
                - '1732500000005'
                - text
            - variable: grounding_level
              value_selector:
                - '1732500000001'
                - grounding_level
            - variable: brief
              value_selector:
                - '1732500000001'
                - brief
            - variable: transcript
              value_selector:
                - '1732500000001'
                - transcript
